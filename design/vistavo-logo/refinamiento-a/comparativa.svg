<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><rect width="1200" height="880" fill="#F7F8FA"/><text x="40" y="48" font-family="Inter" font-size="15" font-weight="700" fill="#0F6B45">VISTAVO · IDENTIDAD VISUAL</text><text x="40" y="102" font-family="Inter" font-size="36" font-weight="600" fill="#111827">Más unidad. Más carácter.</text><text x="40" y="135" font-family="Inter" font-size="16" font-weight="400" fill="#4B5563">Tres variantes de la A que elegiste. Conservamos el verde y la tipografía.</text><rect x="40" y="166" width="360" height="576" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="64" y="205" font-family="Inter" font-size="18" font-weight="600" fill="#111827">A1 · Unida</text><g transform="translate(164 245) scale(1.75)" color="#0F6B45"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(82 389) scale(0.75)" color="#0F6B45"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="144" y="426" font-family="Inter" font-size="42" font-weight="600" fill="#111827">Vistavo</text><rect x="64" y="462" width="312" height="86" rx="12" fill="#111827"/><g transform="translate(85 485) scale(0.625)" color="#FFFFFF"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="138" y="518" font-family="Inter" font-size="34" font-weight="600" fill="#FFFFFF">Vistavo</text><text x="64" y="582" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">SÍMBOLO A TAMAÑO PEQUEÑO</text><g transform="translate(67 604) scale(0.25)" color="#111827"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="67" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">16 px</text><g transform="translate(149 600) scale(0.375)" color="#111827"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="149" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">24 px</text><g transform="translate(231 596) scale(0.5)" color="#111827"><path d="M24 10 H10 V22 L32 50 L54 22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="231" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">32 px</text><text x="64" y="692" font-family="Inter" font-size="13" font-weight="400" fill="#4B5563">La V y el encuadre se vuelven un solo trazo.</text><text x="64" y="716" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Una firma más continua y ligera.</text><rect x="420" y="166" width="360" height="576" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="444" y="205" font-family="Inter" font-size="18" font-weight="600" fill="#111827">A2 · Con gesto</text><g transform="translate(544 245) scale(1.75)" color="#0F6B45"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><g transform="translate(462 389) scale(0.75)" color="#0F6B45"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><text x="524" y="426" font-family="Inter" font-size="42" font-weight="600" fill="#111827">Vistavo</text><rect x="444" y="462" width="312" height="86" rx="12" fill="#111827"/><g transform="translate(465 485) scale(0.625)" color="#FFFFFF"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><text x="518" y="518" font-family="Inter" font-size="34" font-weight="600" fill="#FFFFFF">Vistavo</text><text x="444" y="582" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">SÍMBOLO A TAMAÑO PEQUEÑO</text><g transform="translate(447 604) scale(0.25)" color="#111827"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><text x="447" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">16 px</text><g transform="translate(529 600) scale(0.375)" color="#111827"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><text x="529" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">24 px</text><g transform="translate(611 596) scale(0.5)" color="#111827"><path fill="currentColor" d="M8 13 H19 L32 40 L43 17 H36 V9 H56 V19 L38 53 Q32 63 26 53 Z"/></g><text x="611" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">32 px</text><text x="444" y="692" font-family="Inter" font-size="13" font-weight="400" fill="#4B5563">Un remate propio en el brazo de la V.</text><text x="444" y="716" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Más carácter geométrico y sensación de avance.</text><rect x="800" y="166" width="360" height="576" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="824" y="205" font-family="Inter" font-size="18" font-weight="600" fill="#111827">A3 · Con presencia</text><g transform="translate(924 245) scale(1.75)" color="#0F6B45"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><g transform="translate(842 389) scale(0.75)" color="#0F6B45"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><text x="904" y="426" font-family="Inter" font-size="42" font-weight="600" fill="#111827">Vistavo</text><rect x="824" y="462" width="312" height="86" rx="12" fill="#111827"/><g transform="translate(845 485) scale(0.625)" color="#FFFFFF"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><text x="898" y="518" font-family="Inter" font-size="34" font-weight="600" fill="#FFFFFF">Vistavo</text><text x="824" y="582" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">SÍMBOLO A TAMAÑO PEQUEÑO</text><g transform="translate(827 604) scale(0.25)" color="#111827"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><text x="827" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">16 px</text><g transform="translate(909 600) scale(0.375)" color="#111827"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><text x="909" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">24 px</text><g transform="translate(991 596) scale(0.5)" color="#111827"><path fill="currentColor" fill-rule="evenodd" d="M18 4 H46 Q60 4 60 18 V46 Q60 60 46 60 H18 Q4 60 4 46 V18 Q4 4 18 4 Z M14 17.75 H22.25 L32 38 L40.25 20.75 H35 V14.75 H50 V22.25 L36.5 47.75 Q32 55.25 27.5 47.75 Z"/></g><text x="991" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">32 px</text><text x="824" y="692" font-family="Inter" font-size="13" font-weight="400" fill="#4B5563">El mismo gesto, dentro de una ventana.</text><text x="824" y="716" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">Más peso visual y presencia como icono.</text><text x="40" y="793" font-family="Inter" font-size="18" font-weight="600" fill="#111827">La forma funciona en verde, negro y blanco.</text><text x="40" y="823" font-family="Inter" font-size="15" font-weight="400" fill="#4B5563">Refinamiento de la dirección A. Comparación de forma, continuidad y presencia.</text><g transform="translate(1094 38) scale(.85)" color="#0F6B45"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21 L32 47 L46 21" stroke-width="8"/><path d="M20 8 H8 V20 M44 56 H56 V44" stroke-width="6"/></g></g><text x="1090" y="116" font-family="Inter" font-size="12" fill="#6B7280">A original</text></svg>
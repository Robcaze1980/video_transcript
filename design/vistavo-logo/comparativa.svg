00" fill="#111827">C · Conexión</text><g transform="translate(924 245) scale(1.75)" color="#0F6B45"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><g transform="translate(842 389) scale(0.75)" color="#0F6B45"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><text x="904" y="426" font-family="Inter" font-size="42" font-weight="600" fill="#111827">Vistavo</text><rect x="824" y="462" width="312" height="86" rx="12" fill="#111827"/><g transform="translate(845 485) scale(0.625)" color="#FFFFFF"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><text x="898" y="518" font-family="Inter" font-size="34" font-weight="600" fill="#FFFFFF">Vistavo</text><text x="824" y="582" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">SÍMBOLO A TAMAÑO PEQUEÑO</text><g transform="translate(827 604) scale(0.25)" color="#111827"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><text x="827" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">16 px</text><g transform="translate(909 600) scale(0.375)" color="#111827"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><text x="909" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">24 px</text><g transform="translate(991 596) scale(0.5)" color="#111827"><g fill="currentColor"><path d="M18 10 H24 C40 22 14 42 30 54 H18 Q8 54 8 44 V20 Q8 10 18 10 Z"/><path d="M34 10 H46 Q56 10 56 20 V44 Q56 54 46 54 H40 C24 42 50 22 34 10 Z"/></g></g><text x="991" y="648" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">32 px</text><text x="824" y="692" font-family="Inter" font-size="13" font-weight="400" fill="#4B5563">Dos piezas se encuentran sin usar banderas.</text><text x="824" y="716" font-family="Inter" font-size="12" font-weight="400" fill="#6B7280">La relación con el video es menos directa.</text><text x="40" y="793" font-family="Inter" font-size="18" font-weight="600" fill="#111827">La forma funciona en verde, negro y blanco.</text><text x="40" y="823" font-family="Inter" font-size="15" font-weight="400" fill="#4B5563">Exploración para elegir una dirección. Ninguna propuesta está aplicada a la web.</text></svg>
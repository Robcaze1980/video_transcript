<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><rect width="1200" height="880" fill="#F7F8FA"/><text x="40" y="48" font-family="Inter" font-size="15" font-weight="700" fill="#0F6B45">VISTAVO · IDENTIDAD VISUAL</text><text x="40" y="102" font-family="Inter" font-size="36" font-weight="600" fill="#111827">Tres direcciones para el logo.</text><text x="40" y="135" font-family="Inter" font-size="16" font-weight="400" fill="#4B5563">Mismo verde y misma tipografía. Comparamos la forma, no el color.</text><rect x="40" y="166" width="360" height="576" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="64" y="205" font-family="Inter" font-size="18" font-weight="600" fill="#111827">A · V + encuadre</text><g transform="translate(164 245) scale(1.75)" color="#0F6B45"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21 L32 47 L46 21" stroke-width="8"/><path d="M20 8 H8 V20 M44 56 H56 V44" stroke-width="6"/></g></g><g transform="translate(82 389) scale(0.75)" color="#0F6B45"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21 L32 47 L46 21" stroke-width="8"/><path d="M20 8 H8 V20 M44 56 H56 V44" stroke-width="6"/></g></g><text x="144" y="426" font-family="Inter" font-size="42" font-weight="600" fill="#111827">Vistavo</text><rect x="64" y="462" width="312" height="86" rx="12" fill="#111827"/><g transform="translate(85 485) scale(0.625)" color="#FFFFFF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21 L32 47 L46 21" stroke-width="8"/><path d="M20 8 H8 V20 M44 56 H56 V44" stroke-width="6"/></g></g><text x="138" y="518" font-family="Inter" font-size="34" font-weight="600" fill="#FFFFFF">Vistavo</text><text x="64" y="582" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">SÍMBOLO A TAMAÑO PEQUEÑO</text><g transform="translate(67 604) scale(0.25)" color="#111827"><g fill="none" stroke=